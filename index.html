<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Espectacular</title>
    
    <!-- Script de Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Metadades de Google -->
    <meta name="google-signin-client_id" content="778830160053-0i0n3v53abp3k3eedfnvve4u9k6u1mov.apps.googleusercontent.com">
    
    <!-- ESTILS CSS (Generats per la IA) -->
    <style>
      /* Importem una font moderna de Google Fonts */
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

      /* Estil general del fons de la pàgina */
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Fons fosc i profund */
        font-family: 'Poppins', sans-serif;
        color: #ffffff;
        overflow: hidden;
      }

      /* Targeta central amb efecte de vidre (Glassmorphism) */
      .container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      /* Estil per al títol de benvinguda */
      #missatge-benvinguda {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
        text-align: center;
        /* Text amb degradat */
        background: -webkit-linear-gradient(45deg, #00f2fe, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        /* Animació d'aparició */
        animation: fadeInDown 0.8s ease-out;
      }

      /* Estil per al botó de tancar sessió */
      #boto-sortir {
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        font-size: 1rem;
        font-weight: 500;
        color: white;
        background: linear-gradient(to right, #ff416c, #ff4b2b);
        border: none;
        border-radius: 50px;
        padding: 12px 30px;
        box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      /* Efecte al passar el ratolí pel botó */
      #boto-sortir:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 8px 25px rgba(255, 65, 108, 0.6);
      }

      /* Animació per al text */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    
    <div class="container">
      <!-- Botó de Google -->
      <div id="g_id_onload" data-client_id="778830160053-0i0n3v53abp3k3eedfnvve4u9k6u1mov.apps.googleusercontent.com" data-callback="onSignIn"></div>
      <div class="g_id_signin" data-type="standard"></div>
      
      <!-- Missatge de benvinguda (inicialment amagat) -->
      <h2 id="missatge-benvinguda" style="display:none;">Missatge de benvinguda</h2>
      
      <!-- Botó de sortir (inicialment amagat) -->
      <button id="boto-sortir" style="display:none;" onclick="signout()">Tancar sessió</button>
    </div>

    <script>
      function onSignIn(response) {
        var id_token = response.credential;
        console.log("ID token: " + id_token);
        
        // Descodifiquem el token per treure el nom
        const dades = JSON.parse(decodeURIComponent(escape(atob(
            id_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
        
        // Mostrem el missatge personalitzat
        var missatgeH2 = document.getElementById('missatge-benvinguda');
        missatgeH2.innerText = "Benvingut/da, " + dades.name;
        missatgeH2.style.display = 'block'; 
        
        // Amaguem el botó de Google i mostrem el de sortir
        document.getElementById('boto-sortir').style.display = 'block';
        document.querySelector('.g_id_signin').style.display = 'none'; 
      }

      function signout() {
        document.getElementById('missatge-benvinguda').style.display = 'none';
        document.getElementById('boto-sortir').style.display = 'none';
        document.querySelector('.g_id_signin').style.display = 'block';
        google.accounts.id.disableAutoSelect();
      }
    </script>
  </body>
</html>
